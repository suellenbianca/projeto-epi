
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle de EPI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .login-container h2 {
            text-align: center;
            color: #19395f;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #19395f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #24558a;
        }

        .erro {
            color: #c62828;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>Controle de EPI</h2>
        <p>Entre com seus dados para acessar o sistema.</p>

        <form method="POST">
            {% csrf_token %}

            <label>Usuário</label>
            <input type="text" name="username" placeholder="Digite seu usuário" required>

            <label>Senha</label>
            <input type="password" name="password" placeholder="Digite sua senha" required>

            {% if form.errors %}
                <div class="erro">
                    Usuário ou senha incorretos.
                </div>
            {% endif %}

            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
